# This makes sure we wait for the sleep-apps.target
# to become active.
# sleep-apps.target becomes active when all apps
# registered with the pm framework have sent ACK
# and are ready to go to Deep Sleep.
[Unit]
After=sleep-apps.target
Requires=sleep-apps.target

# This makes sure we start before the sleep-drivers.target
# to become active.
# sleep-drivers.target becomes active when all drivers
# registered with the pm framework have sent ACK
# and are ready to go to Deep Sleep.
Before=sleep-drivers.target
PartOf=sleep-drivers.target

# This is the process that will be called when a notification
# is sent to the pil-rm.
# ExecStart is called when SUSPEND notification is received.
# ExecStopPost is called when RESUME notification is received.
[Service]
ExecStart=notify_aop enter
ExecStopPost=notify_aop exit

# Indicates that this service is required by
# sleep-drivers.target.
# When system reaches the sleep-drivers.target systemd will
# automatically start the services required by it.
[Install]
RequiredBy=sleep-drivers.target
