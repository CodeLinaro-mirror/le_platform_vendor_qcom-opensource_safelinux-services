# This makes sure we wait for ssctl sleep-notify service
# to complete
[Unit]
After=sleep-notify@ssctl-service.service
Requires=sleep-notify@ssctl-service.service

# This makes sure we start before pil-rm sleep-notify service
# to become active.
Before=sleep-notify@pil-rm.service
PartOf=sleep.target

# This is the process that will be called when a notification
# is sent to the pil-rm.
# ExecStart is called when SUSPEND notification is received.
# ExecStopPost is called when RESUME notification is received.
[Service]
ExecStart=notify_aop enter
ExecStopPost=notify_aop exit

# Indicates that this service is required by
# sleep.target.
# When system reaches the sleep.target systemd will
# automatically start the services required by it.
[Install]
RequiredBy=sleep.target
